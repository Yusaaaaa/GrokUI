[package]
name = "grokui"
version = "0.1.0"
description = "Desktop client for local Grok Build"
authors = ["yusa"]
edition = "2021"

[lib]
name = "grokui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
libc = "0.2"
